name: vertex
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  file_picker: ^8.1.4
  firebase_auth: ^5.4.0
  firebase_core: ^3.10.0
  flutter:
    sdk: flutter
  flutter_svg: ^2.3.0
  get: ^4.7.3
  google_sign_in: 6.2.1
  http: ^1.6.0 
  fl_chart: ^0.69.0
  intl: ^0.19.0
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.4
  get_storage: ^2.1.1
  home_widget: ^0.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/V.png" 
  min_sdk_android: 21
  adaptive_icon_background: "#161B22" 
  adaptive_icon_foreground: "assets/V.png"